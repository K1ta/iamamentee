apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: orders-infra
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: admin
            - name: POSTGRES_PASSWORD
              value: password
            - name: POSTGRES_DB
              value: orders
          args:
            - "-c"
            - "shared_buffers=5GB"
            - "-c"
            - "effective_cache_size=7GB"
            - "-c"
            - "bgwriter_lru_maxpages=200"
            - "-c"
            - "bgwriter_delay=50ms"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
